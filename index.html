<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cocktail Maker</title>
<meta name="description" content="Cocktailgids met 22 recepten: benodigdheden, stappenplan, smaak en weetjes.">
<meta name="theme-color" content="#eef1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111613" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cocktails">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: a home-bar menu card. List of illustrated cocktails, tap opens a full-screen recipe sheet with two tabs (benodigdheden / stappenplan). */
:root{
  --bg:#eef1ec; --surface:#fbfcfa; --ink:#1c2420; --muted:#5d6a63; --line:#d6ddd7;
  --accent:#1f5c4a; --accent-ink:#ffffff; --amber:#b8681f; --done:#9aa59f; --dim:#0000;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 6px 18px rgba(20,40,30,.07);
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --tintmix:100%;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#1a211d; --ink:#edf1ec; --muted:#9fada5; --line:#2c3631;
  --accent:#74c7a4; --accent-ink:#0d1a14; --amber:#e3a35a; --done:#5f6b65;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --tintmix:62%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#1a211d; --ink:#edf1ec; --muted:#9fada5; --line:#2c3631;
  --accent:#74c7a4; --accent-ink:#0d1a14; --amber:#e3a35a; --done:#5f6b65;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --tintmix:62%; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 48px}

/* Home */
.mast{display:flex;flex-direction:column;gap:4px;padding-block:8px 18px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:700}
h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,11vw,64px);line-height:.95;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 em{font-style:italic;font-weight:500;color:var(--accent)}
.mast p{margin:6px 0 0;color:var(--muted);max-width:46ch}
.search{position:relative;margin-top:6px}
.search input{width:100%;font:inherit;font-size:16px;padding:12px 14px 12px 42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:14px 0 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{font-size:13px;color:var(--muted);margin:12px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:0;border-radius:18px;overflow:hidden;cursor:pointer;padding:0;box-shadow:var(--shadow);transition:transform .15s ease}
.card:active{transform:scale(.98)}
.card .art{background:color-mix(in oklab,var(--tint) var(--tintmix),#0c110e);aspect-ratio:1/1.02;display:grid;place-items:center;position:relative}
.card .art svg{width:88%;height:auto;display:block}
.card .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card h3{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.1;margin:0}
.card small{color:var(--muted);font-size:12.5px}
.fav-dot{position:absolute;top:8px;right:10px;font-size:16px;color:#b3263f}
.badge{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.85);color:#1d4d3c;font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:999px}
.empty{color:var(--muted);padding:30px 0;text-align:center}

/* Detail sheet */
.sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:10;-webkit-overflow-scrolling:touch;animation:up .28s ease}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.card{transition:none}}
.topbar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.iconbtn{border:0;background:var(--surface);border-radius:999px;height:40px;padding:0 14px;display:flex;align-items:center;gap:6px;font-weight:600;font-size:15px;cursor:pointer;box-shadow:var(--shadow)}
.iconbtn svg{width:18px;height:18px}
.iconbtn.fav[aria-pressed="true"]{color:#c42a47}
.hero{background:color-mix(in oklab,var(--tint) var(--tintmix),#0c110e);display:grid;place-items:center;padding:6px 0 0;margin-top:-60px;padding-top:60px}
.hero svg{width:min(78vw,340px);height:auto;display:block}
.inner{max-width:680px;margin:0 auto;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
.d-title{font-family:var(--display);font-size:clamp(34px,9vw,48px);font-weight:700;line-height:1;margin:4px 0 10px;text-wrap:balance}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.tag.af{color:var(--accent);border-color:color-mix(in oklab,var(--accent) 40%,var(--line))}
.taste{font-size:17px;margin:16px 0 0;max-width:60ch}
.fact{margin:16px 0 0;padding:14px 16px;border-radius:14px;background:var(--surface);display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.fact .k{font-family:var(--display);font-style:italic;font-size:26px;line-height:1;color:var(--amber)}
.fact b{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-bottom:2px}
.fact p{margin:0;font-size:15px;min-width:0}
.note{margin:12px 0 0;font-size:13.5px;color:var(--muted);border-left:2px solid var(--amber);padding-left:10px}

.seg{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin:22px 0 4px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;padding:10px 6px;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

.persons{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 6px}
.persons span{font-weight:600}
.stepper{display:flex;align-items:center;gap:4px;background:var(--surface);border-radius:999px;padding:4px;border:1px solid var(--line)}
.stepper button{width:34px;height:34px;border-radius:999px;border:0;background:transparent;font-size:20px;font-weight:600;cursor:pointer}
.stepper output{min-width:64px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--muted);margin:0 0 4px}

h4{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;font-weight:700}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:14px;overflow:hidden}
.list li{border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.check{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:12px 14px;cursor:pointer}
.box{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center}
.check[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.check[aria-pressed="true"] .box::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.check[aria-pressed="true"] .txt{color:var(--done);text-decoration:line-through}
.qty{font-variant-numeric:tabular-nums;font-weight:700;min-width:74px;display:inline-block}
.txt{min-width:0}
.plain{padding:12px 14px;display:flex;gap:12px;align-items:center}
.ico{flex:none;width:22px;height:22px;color:var(--accent)}

.progress{display:flex;align-items:center;gap:12px;margin:16px 0 4px}
.bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.progress small{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.step{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;width:100%;text-align:left;border:0;background:var(--surface);border-radius:14px;padding:14px;cursor:pointer;box-shadow:var(--shadow)}
.num{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;background:color-mix(in oklab,var(--accent) 14%,var(--surface));color:var(--accent)}
.step.prep .num{background:color-mix(in oklab,var(--amber) 16%,var(--surface));color:var(--amber);font-size:15px}
.step .s-txt{font-size:16.5px;padding-top:5px;min-width:0}
.step .s-txt b{font-weight:700}
.step .lbl{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);font-weight:700}
.step[aria-pressed="true"]{box-shadow:none;background:transparent;border:1px dashed var(--line)}
.step[aria-pressed="true"] .num{background:var(--accent);color:var(--accent-ink)}
.step[aria-pressed="true"] .s-txt{color:var(--done)}
.tip{margin:14px 0 0;padding:12px 14px;border-radius:14px;border:1px solid var(--line);font-size:15px}
.tip b{color:var(--amber)}
.reset{margin-top:16px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.cheers{display:none;margin-top:14px;text-align:center;font-family:var(--display);font-style:italic;font-size:26px;color:var(--accent)}
.cheers.on{display:block}
.wl{font-size:12.5px;color:var(--muted);margin-top:8px}
footer{margin-top:32px;font-size:13px;color:var(--muted)}

.intro{max-width:680px;margin:0 auto;padding:18px 16px 0}
.inner{padding-top:0}
.colhead{display:none}

/* iPad / groot scherm liggend: lijst links, recept rechts */
@media (min-width:1000px){
  #home{position:fixed;top:0;bottom:0;left:0;width:400px;overflow-y:auto;max-width:none;margin:0;padding:calc(env(safe-area-inset-top,0px) + 24px) 20px 40px;border-right:1px solid var(--line)}
  #home h1{font-size:48px}
  .grid{grid-template-columns:1fr 1fr}
  .card[aria-current="true"]{outline:3px solid var(--accent);outline-offset:2px}
  .sheet{left:400px;z-index:1;animation:none}
  .topbar{justify-content:flex-end;padding:calc(env(safe-area-inset-top,0px) + 16px) 32px 8px;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;pointer-events:none}
  .topbar .iconbtn{pointer-events:auto}
  .head{padding-top:0!important}
  #back{display:none}
  .head{display:grid;grid-template-columns:minmax(300px,42%) 1fr;gap:36px;align-items:center;max-width:1040px;margin:0 auto;padding:28px 32px 0}
  .hero{margin:0;padding:12px;border-radius:28px}
  .hero svg{width:100%;max-width:360px}
  .intro{padding:0;margin:0;max-width:56ch}
  .d-title{font-size:56px}
  .inner{max-width:1040px;padding:8px 32px 48px}
  .seg{display:none}
  .cols{display:grid;grid-template-columns:1fr 1.3fr;gap:36px;align-items:start}
  .cols section[hidden]{display:block!important}
  .colhead{display:block;font-family:var(--display);font-size:28px;font-weight:700;margin:12px 0 0}
  .col-steps .progress{margin-top:12px}
  .persons{max-width:420px;padding-top:24px}
  .step .s-txt{font-size:17.5px}
}
@media (min-width:1000px) and (max-width:1149px){
  .cols{grid-template-columns:1fr}
  .head{grid-template-columns:1fr;max-width:640px}
  .hero svg{max-width:300px}
}

/* Menu */
.mast{position:relative}
.menuwrap{position:absolute;top:4px;right:0}
.menubtn{border:0;background:var(--surface);border-radius:999px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.menubtn svg{width:22px;height:22px}
.menu{position:absolute;right:0;top:52px;min-width:230px;background:var(--surface);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;z-index:5;display:flex;flex-direction:column}
.menu[hidden],.kaart[hidden],.sheet[hidden]{display:none}
.menu button{border:0;background:transparent;text-align:left;padding:12px 12px;border-radius:10px;font-weight:600;cursor:pointer;display:flex;gap:10px;align-items:center}
.menu button:hover{background:var(--bg)}
.menu svg{width:20px;height:20px;color:var(--accent);flex:none}

/* Cocktailkaart: always a printed-paper look, independent of theme */
.kaart{position:fixed;inset:0;z-index:20;overflow-y:auto;background:#e9ebe6;-webkit-overflow-scrolling:touch}
.kaart .topbar{background:rgba(233,235,230,.9);color:#1c2420}
.kaart .iconbtn{background:#fff;color:#1c2420}
.k-actions{display:flex;gap:8px}
a.iconbtn{text-decoration:none}
.paper{--k-ink:#1b2a24;--k-muted:#5b6862;--k-gold:#a8691f;--k-line:#d9ddd5;
  background:#fffefb;color:var(--k-ink);max-width:820px;margin:8px auto 40px;padding:36px 22px 40px;box-shadow:0 2px 20px rgba(0,0,0,.08)}
.k-cover{text-align:center;padding:12px 0 26px;border-bottom:1px solid var(--k-line)}
.k-cover .eb{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--k-gold);font-weight:700}
.k-cover h2{font-family:var(--display);font-size:clamp(46px,12vw,84px);font-weight:500;font-style:italic;line-height:1;margin:10px 0 8px;letter-spacing:-.01em}
.k-cover p{margin:0 auto;max-width:44ch;color:var(--k-muted);font-size:15px}
.k-cover-art{display:none;justify-content:center;gap:4mm;margin:12mm 0 0}
.k-cover-art span{width:26mm;height:26mm;border-radius:50%;overflow:hidden;display:grid;place-items:center}
.k-cover-art svg{width:118%;height:auto;margin-top:6%}
.k-toc{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;margin-top:16px;font-family:var(--display);font-style:italic;font-size:16px;color:var(--k-gold)}
.k-sec{padding-top:30px}
.k-sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
.k-sec-head h3{font-family:var(--display);font-size:30px;font-weight:700;margin:0;line-height:1.05;white-space:nowrap}
.k-sec-head::after{content:"";flex:1;border-bottom:1px solid var(--k-line);transform:translateY(-6px)}
.k-sec-sub{margin:0 0 14px;color:var(--k-muted);font-style:italic;font-family:var(--display);font-size:17px}
.k-grid{display:grid;grid-template-columns:1fr;gap:18px 30px}
@media (min-width:640px){.k-grid{grid-template-columns:1fr 1fr}.paper{padding:52px 48px 56px}}
.k-item{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:start;break-inside:avoid}
.k-img{width:92px;height:92px;border-radius:50%;overflow:hidden;display:grid;place-items:center}
.k-img svg{width:118%;height:auto;margin-top:6%}
.k-body{min-width:0}
.k-body h5{font-family:var(--display);font-size:21px;font-weight:700;margin:0;line-height:1.1}
.k-body h5 small{font-family:var(--body);font-size:10px;font-weight:700;letter-spacing:.12em;color:#1f6b52;border:1px solid #9cc7b5;border-radius:99px;padding:1px 6px;margin-left:6px;vertical-align:3px}
.k-ing{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--k-gold);font-weight:700;margin:4px 0 4px;line-height:1.45}
.k-taste{font-size:13.5px;line-height:1.45;margin:0}
.k-fact{font-family:var(--display);font-style:italic;font-size:13.5px;line-height:1.4;color:var(--k-muted);margin:5px 0 0}
.k-foot{text-align:center;margin-top:34px;padding-top:16px;border-top:1px solid var(--k-line);font-size:12px;color:var(--k-muted);letter-spacing:.06em}

@media print{
  @page{size:A4;margin:14mm 13mm}
  html,body{background:#fff!important}
  #home,#sheet,.kaart .topbar{display:none!important}
  .kaart{position:static;overflow:visible;background:#fff}
  .paper{box-shadow:none;margin:0;max-width:none;padding:0;background:#fff}
  .k-grid{grid-template-columns:1fr 1fr;gap:9mm 9mm}
  .k-item{grid-template-columns:30mm 1fr;gap:4.5mm}
  .k-img{width:30mm;height:30mm}
  .k-body h5{font-size:19pt}
  .k-ing{font-size:7.6pt;margin:1.5mm 0 2mm}
  .k-taste{font-size:10.2pt;line-height:1.45}
  .k-fact{font-size:10pt;margin-top:2mm}
  .k-sec-head h3{font-size:26pt}
  .k-sec-sub{font-size:12.5pt;margin-bottom:7mm}
  .k-sec+.k-sec{break-before:page}
  .k-sec.keep{break-before:auto}
  *{outline:none!important}
  .k-cover{height:262mm;display:flex;flex-direction:column;justify-content:center;border-bottom:0;break-after:page;padding:0}
  .k-cover h2{font-size:78pt;margin:6mm 0 5mm}
  .k-cover p{font-size:13pt}
  .k-toc{font-size:14pt;margin-top:10mm;flex-direction:column;gap:2mm}
  .k-cover-art{display:flex!important}
  .k-sec{padding-top:8mm}
  .k-sec-head{break-after:avoid}
  .k-sec-sub{break-after:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="wrap" id="home">
  <header class="mast">
    <div class="menuwrap">
      <button class="menubtn" id="menubtn" aria-label="Menu" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="menu" id="menu" hidden>
        <button id="m-kaart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M7 8V3h10v5"/><rect x="3" y="8" width="18" height="9" rx="2"/><path d="M7 14h10v7H7z"/></svg>Print cocktailkaart</button>
      </div>
    </div>
    <span class="eyebrow">De huisbar</span>
    <h1>Cocktail <em>Maker</em></h1>
    <p>Kies een cocktail en volg het stappenplan. Bij elk recept vind je ook alles wat je moet klaarzetten.</p>
  </header>
  <label class="search" for="q">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Zoek op naam of ingrediënt…" autocomplete="off">
  </label>
  <div class="chips" id="chips" role="toolbar" aria-label="Filter"></div>
  <div class="count" id="count"></div>

const GL={
 martini:{bowl:"M36,54 L164,54 L100,134 Z",stem:[134,196],foot:34,level:64,rim:[36,164,54],base:134},
 coupe:{bowl:"M38,62 L162,62 C162,112 134,134 100,134 C66,134 38,112 38,62 Z",stem:[134,196],foot:34,level:72,rim:[38,162,62],base:134},

 highball:{bowl:"M62,30 L138,30 L133,198 L67,198 Z",level:48,rim:[62,138,30],base:198,thick:10},

function rng(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647}
function hash(str){let h=7;for(const ch of str)h=(h*31+ch.charCodeAt(0))>>>0;return h}

function wheel(x,y,r,col,inner,rot=0){
  let s=`<g transform="translate(${x},${y}) rotate(${rot})"><circle r="${r}" fill="${col}"/><circle r="${r-3}" fill="${inner}"/>`;
  for(let i=0;i<8;i++){const a=i*Math.PI/4;s+=`<line x1="0" y1="0" x2="${((r-3)*Math.cos(a)).toFixed(1)}" y2="${((r-3)*Math.sin(a)).toFixed(1)}" stroke="${col}" stroke-width="1.6" opacity=".55"/>`}
  return s+`<circle r="2.2" fill="${col}" opacity=".6"/></g>`;
}
function wedge(x,y,r,col,inner,rot){
  return `<g transform="translate(${x},${y}) rotate(${rot})"><path d="M${-r},0 A${r},${r} 0 0 0 ${r},0 Z" fill="${col}"/><path d="M${-r+3},0 A${r-3},${r-3} 0 0 0 ${r-3},0 Z" fill="${inner}"/>`+
  [30,60,90,120,150].map(a=>{const t=a*Math.PI/180;return `<line x1="0" y1="0" x2="${((r-3)*Math.cos(t)).toFixed(1)}" y2="${((r-3)*Math.sin(t)).toFixed(1)}" stroke="${col}" stroke-width="1.4" opacity=".5"/>`}).join("")+`</g>`;
}
function leaf(x,y,rot,len=16){return `<g transform="translate(${x},${y}) rotate(${rot})"><path d="M0,0 C${len*.35},${-len*.45} ${len*.8},${-len*.35} ${len},0 C${len*.8},${len*.35} ${len*.35},${len*.45} 0,0 Z" fill="#3f9a4e"/><path d="M1,0 L${len-2},0" stroke="#2c7a3b" stroke-width="1"/></g>`}

function art(c,pfx){
  const L=c.look,g=GL[L.g],id=pfx+c.id,r=rng(hash(c.id)+3);
  const [rl,rr,ry]=g.rim;
  let s=`<svg viewBox="0 0 200 220" role="img" aria-label="Illustratie van een ${c.name}"><defs>
  <linearGradient id="${id}l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${L.top}"/><stop offset="1" stop-color="${L.bot||L.top}"/></linearGradient>
  <linearGradient id="${id}cu" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9a4f22"/><stop offset=".3" stop-color="#e09a5c"/><stop offset=".45" stop-color="#f4c08d"/><stop offset=".7" stop-color="#b8662e"/><stop offset="1" stop-color="#7e3c18"/></linearGradient>`;
  if(g.bowl)s+=`<clipPath id="${id}c"><path d="${g.bowl}"/></clipPath>`;
  s+=`</defs>`;
  s+=`<circle cx="100" cy="112" r="88" fill="#ffffff" opacity=".22"/>`;
  s+=`<ellipse cx="100" cy="206" rx="${L.g==="mug"?56:44}" ry="6" fill="#000" opacity=".12"/>`;

  if(L.g==="mug"){
    // handle
    s+=`<path d="M144,108 C176,106 178,170 142,168" fill="none" stroke="url(#${id}cu)" stroke-width="11" stroke-linecap="round"/>`;
    // ice above rim
    if(L.ice)for(let i=0;i<4;i++){const x=64+i*19+r()*6,y=66+r()*10;s+=`<rect x="${x}" y="${y}" width="22" height="22" rx="4" transform="rotate(${(r()*40-20).toFixed(0)} ${x+11} ${y+11})" fill="#ffffff" opacity=".7" stroke="#ffffff"/>`}
    s+=`<ellipse cx="100" cy="84" rx="44" ry="7" fill="${L.top}"/>`;
    s+=`<path d="M54,82 L146,82 L140,200 L60,200 Z" fill="url(#${id}cu)"/>`;
    s+=`<ellipse cx="100" cy="82" rx="46" ry="6" fill="none" stroke="#f6c896" stroke-width="3"/>`;
    s+=`<path d="M58,96 L142,96" stroke="#7e3c18" stroke-width="2" opacity=".5"/><path d="M60,186 L140,186" stroke="#7e3c18" stroke-width="2" opacity=".5"/>`;
    s+=`<path d="M70,104 L68,180" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".35"/>`;
  } else {
    const lv=g.level, bot=g.base;
    // stem and foot
    if(g.stem){s+=`<path d="M100,${g.stem[0]} L100,${g.stem[1]}" stroke="#ffffff" stroke-width="5" opacity=".75"/><path d="M100,${g.stem[0]} L100,${g.stem[1]}" stroke="#000" stroke-width="1" opacity=".12"/>`;
      s+=`<ellipse cx="100" cy="${g.stem[1]+3}" rx="${g.foot}" ry="5.5" fill="#ffffff" opacity=".75" stroke="#000" stroke-opacity=".12"/>`}
    s+=`<g clip-path="url(#${id}c)">`;
    s+=`<rect x="0" y="${lv}" width="200" height="${bot-lv+2}" fill="url(#${id}l)"/>`;
    if(L.float){const h=(bot-lv)*L.float[1];s+=`<rect x="0" y="${lv}" width="200" height="${h}" fill="${L.float[0]}"/><rect x="0" y="${lv+h-3}" width="200" height="6" fill="${L.float[0]}" opacity=".5"/>`}
    if(L.foam){s+=`<rect x="0" y="${lv-1}" width="200" height="${L.foam}" fill="#fffaf0" opacity=".92"/>`}
    if(L.bubbles){for(let i=0;i<22;i++){const x=40+r()*120,y=lv+8+r()*(bot-lv-12);s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(0.8+r()*1.8).toFixed(1)}" fill="#ffffff" opacity="${(0.35+r()*.4).toFixed(2)}"/>`}}
    if(L.ice==="cubes"){const n=L.g==="highball"?5:L.g==="wine"?4:3;for(let i=0;i<n;i++){const x=(L.g==="highball"?72+r()*36:58+i*(80/n)+r()*10),y=(L.g==="highball"?lv-4+i*28+r()*6:lv-6+r()*26);const w=L.g==="highball"?28:26;s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w}" height="${w}" rx="5" transform="rotate(${(r()*40-20).toFixed(0)} ${x+w/2} ${y+w/2})" fill="#ffffff" opacity=".32" stroke="#ffffff" stroke-opacity=".75" stroke-width="1.5"/>`}}
    if(L.ice==="crushed"){for(let i=0;i<34;i++){const x=48+r()*104,y=lv-8+r()*(bot-lv)*.75,w=6+r()*9;s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${(w*.8).toFixed(1)}" rx="2" transform="rotate(${(r()*90).toFixed(0)} ${x} ${y})" fill="#ffffff" opacity="${(0.3+r()*.35).toFixed(2)}"/>`}}
    if(g.thick)s+=`<rect x="0" y="${bot-g.thick}" width="200" height="${g.thick}" fill="#ffffff" opacity=".35"/>`;
    s+=`</g>`;
    // glass
    s+=`<path d="${g.bowl}" fill="#ffffff" fill-opacity=".1" stroke="#000" stroke-opacity=".14" stroke-width="4.5" stroke-linejoin="round"/>`;
    s+=`<path d="${g.bowl}" fill="none" stroke="#ffffff" stroke-opacity=".95" stroke-width="2.2" stroke-linejoin="round"/>`;
    // highlight
    s+=`<path d="M${rl+9},${ry+8} L${rl+(L.g==="martini"?32:11)},${ry+(L.g==="martini"?38:Math.min(70,(bot-ry)*.6))}" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".5"/>`;
    if(L.salt){for(let i=0;i<34;i++){const x=rl+3+r()*(rr-rl-6);s+=`<circle cx="${x.toFixed(1)}" cy="${(ry-1+r()*4).toFixed(1)}" r="${(1+r()*1.4).toFixed(1)}" fill="#ffffff" stroke="#9aa3a0" stroke-width=".4"/>`}}
  }
  // garnishes
  (L.garnish||[]).forEach((k,i)=>{
    const rx=rr-6, rL=rl+14;
    if(k==="orange")s+=wheel(rx,ry+4,20,"#f07f1a","#ffbe5c",12);
    if(k==="limewheel")s+=wheel(i? rL:rx,ry+2,17,"#5c9a2d","#c9e58a",-8);
    if(k==="lemon")s+=wheel(rx,ry+4,19,"#e8c21e","#fff1a0",10);
    if(k==="limewedge")s+=wedge(rx,ry,17,"#4f8f26","#cfe98f",-38);
    if(k==="lemontwist")s+=`<path d="M${rr-4},${ry} c10,6 -8,14 4,22 c10,6 -8,14 4,22" fill="none" stroke="#e8b80f" stroke-width="5" stroke-linecap="round"/><path d="M${rr-4},${ry} c10,6 -8,14 4,22 c10,6 -8,14 4,22" fill="none" stroke="#fff3a0" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>`;
    if(k==="mint"){const x=i?rL:rx-6,y=ry-2;s+=leaf(x,y,-120,18)+leaf(x+2,y,-70,20)+leaf(x-2,y+2,-160,15)+`<path d="M${x},${y+2} L${x+1},${y-14}" stroke="#2c7a3b" stroke-width="1.6"/>`}
    if(k==="raspberry"){const x=rL+10,y=ry-20;s+=`<line x1="${x}" y1="${y-14}" x2="${x+14}" y2="${y+40}" stroke="#7a5a3a" stroke-width="2"/>`;for(let a=0;a<9;a++){const dx=(a%3)*5-5,dy=Math.floor(a/3)*5-5;s+=`<circle cx="${x+3+dx}" cy="${y+8+dy}" r="3.4" fill="#d3204f" stroke="#a3123a" stroke-width=".8"/>`}}
    if(k==="passion"){const y=GL[L.g].level-6;s+=`<ellipse cx="100" cy="${y+2}" rx="24" ry="9" fill="#5b1f4f"/><ellipse cx="100" cy="${y}" rx="21" ry="7.5" fill="#f2b62a"/>`;for(let a=0;a<14;a++)s+=`<circle cx="${(86+r()*28).toFixed(1)}" cy="${(y-4+r()*8).toFixed(1)}" r="1.3" fill="#2a1a10"/>`}
  });
  return s+`</svg>`;
}

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function num(v){v=Math.round(v*100)/100;const w=Math.floor(v),f=+(v-w).toFixed(2);const fr={0.5:"½",0.25:"¼",0.75:"¾"}[f];if(fr)return (w||"")+fr;return String(v).replace(".",",")}
function label(t,n){
  const [q,u,name,,plural]=t;
  if(q==null)return {q:"",n:name};
  const tot=Array.isArray(q)?q[1]*n:q*n;
  const amt=Array.isArray(q)?num(q[0]*n)+"–"+num(q[1]*n):num(q*n);
  const many=tot>1;
  const unit={ml:" ml",tl:" tl",dash:many?" dashes":" dash",glas:many?" glazen":" glaasje","":""}[u];
  return {q:amt+unit,n:(many&&plural)?plural:name};
}
function fill(str,c,n){return esc(str).replace(/\{(\d+)\}/g,(m,i)=>{const t=c.ing[+i];if(!t)return m;const l=label(t,n);return `<b>${esc((l.q?l.q+" ":"")+l.n)}</b>`})}

$("#m-kaart").addEventListener("click",()=>{menu.hidden=true;open("kaart")});
$("#k-back").addEventListener("click",()=>close());
$("#k-print").addEventListener("click",()=>window.print());

function route(){
  const id=decodeURIComponent(location.hash.slice(1));
  if(id==="kaart"){renderKaart();$("#kaart").hidden=false;$("#kaart").scrollTop=0;$("#sheet").hidden=true;document.title="Cocktailkaart";return}
  $("#kaart").hidden=true;
  let c=C.find(x=>x.id===id);
  const wide=WIDE.matches;
  if(!c&&wide)c=C.find(x=>x.id===lastId)||C[0];
  if(c)lastId=c.id;
  document.querySelectorAll(".card").forEach(el=>el.setAttribute("aria-current",String(!!c&&el.dataset.id===c.id)));
  if(c&&wide){if(!cur||cur.id!==c.id){persons=1;doneIng=new Set();doneStep=new Set()}cur=c;renderDetail();$("#sheet").hidden=false;$("#sheet").scrollTop=0;$("#home").removeAttribute("aria-hidden");document.title=c.name+" · Cocktail Maker";wake();return}
  if(c){if(!cur||cur.id!==c.id){persons=1;tab="need";doneIng=new Set();doneStep=new Set()}cur=c;opened=true;renderDetail();$("#sheet").hidden=false;$("#sheet").scrollTop=0;$("#home").setAttribute("aria-hidden","true");document.title=c.name+" · Cocktail Maker";wake()}
  else{cur=null;$("#sheet").hidden=true;$("#home").removeAttribute("aria-hidden");document.title="Cocktail Maker";renderList();window.scrollTo(0,scrollY0);release()}
}
window.addEventListener("hashchange",route);
const WIDE=matchMedia("(min-width:1000px)");let lastId=null;
WIDE.addEventListener?WIDE.addEventListener("change",route):WIDE.addListener(route);

async function wake(){try{if(!lock&&navigator.wakeLock){lock=await navigator.wakeLock.request("screen");const w=$("#wl");if(w)w.hidden=false;lock.addEventListener("release",()=>{lock=null})}}catch(e){}}
function release(){try{lock&&lock.release()}catch(e){}lock=null}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&cur)wake()});

const ICON={glass:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 4h14l-7 8z"/><path d="M12 12v7M8 20h8"/></svg>',
 tool:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3h8l-1 4H9z"/><path d="M9 7l-1 14h8L15 7"/></svg>',
 garnish:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16M6.3 6.3l11.4 11.4M17.7 6.3 6.3 17.7" opacity=".55"/></svg>'};

function renderDetail(){
  const c=cur,n=persons;
  const ings=c.ing.map((t,i)=>[t,i]).filter(([t])=>t[3]!=="g");
  const gar=c.ing.filter(t=>t[3]==="g");
  const allSteps=[...c.prep.map(s=>({p:1,s})),...c.steps.map(s=>({p:0,s}))];
  const doneN=doneStep.size,total=allSteps.length;
  let k=0;
  $("#sheet").style.setProperty("--tint",c.tint);
  $("#sheet").innerHTML=`
  <div class="topbar">
    <button class="iconbtn" id="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Alle cocktails</button>
    <button class="iconbtn fav" id="fav" aria-pressed="${favs.has(c.id)}" aria-label="Favoriet"><svg viewBox="0 0 24 24" fill="${favs.has(c.id)?"currentColor":"none"}" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>${favs.has(c.id)?"Favoriet":"Bewaar"}</button>
  </div>
  <div class="head"><div class="hero">${art(c,"d-")}</div>
  <div class="intro">
    <div class="tags">
      <span class="tag">${esc(c.glass)}</span><span class="tag">${c.method}</span>
      ${c.virgin===true?'<span class="tag af">Alcoholvrij</span>':c.virgin?'<span class="tag af">Virgin mogelijk</span>':""}
    </div>
    <h2 class="d-title">${esc(c.name)}</h2>
    <p class="taste">${esc(c.taste)}</p>
    <div class="fact"><span class="k">i</span><p><b>Leuk weetje</b>${esc(c.fact)}</p></div>
    ${c.note?`<p class="note">${esc(c.note)}</p>`:""}
  </div></div>
  <div class="inner">
    <div class="seg" role="tablist">
      <button role="tab" id="t-need" aria-selected="${tab==="need"}">Benodigdheden</button>
      <button role="tab" id="t-steps" aria-selected="${tab==="steps"}">Stappenplan</button>
    </div>

    <div class="persons"><span>Aantal cocktails</span>
      <div class="stepper"><button id="minus" aria-label="Minder">−</button><output id="pn">${n} ${n>1?"glazen":"glas"}</output><button id="plus" aria-label="Meer">+</button></div>
    </div>
    ${n>2&&c.method==="Shaker"?'<p class="hint">Shake per 2 cocktails tegelijk; een standaardshaker is anders te vol.</p>':""}

    <div class="cols">
    <section class="col-need" ${tab==="need"?"":"hidden"}>
      <h3 class="colhead">Benodigdheden</h3>
      <h4>Ingrediënten</h4>
      <p class="hint">Tik aan wat je hebt klaargezet.</p>
      <ul class="list">${ings.map(([t,i])=>{const l=label(t,n);return `<li><button class="check" data-ing="${i}" aria-pressed="${doneIng.has(i)}"><span class="box"></span><span class="txt">${l.q?`<span class="qty">${esc(l.q)}</span>`:""}${esc(l.n)}</span></button></li>`}).join("")}</ul>
      <h4>Garnituur</h4>
      <ul class="list">${gar.length?gar.map(t=>{const l=label(t,n);return `<li class="plain">${ICON.garnish}<span class="txt">${esc((l.q?l.q+" ":"")+l.n)}</span></li>`}).join(""):`<li class="plain">${ICON.garnish}<span class="txt">Geen garnituur</span></li>`}</ul>
      <h4>Materiaal</h4>
      <ul class="list">${c.tools.map((t,i)=>`<li class="plain">${i===0?ICON.glass:ICON.tool}<span class="txt">${esc(t)}</span></li>`).join("")}</ul>
    </section>

    <section class="col-steps" ${tab==="steps"?"":"hidden"}>
      <h3 class="colhead">Stappenplan</h3>
      <div class="progress"><div class="bar"><i style="width:${total?doneN/total*100:0}%"></i></div><small>${doneN} van ${total}</small></div>
      <p class="hint">Tik op een stap als hij klaar is.</p>
      <ol class="steps">${allSteps.map((st,i)=>{const lab=st.p?"V":String(++k);return `<li><button class="step ${st.p?"prep":""}" data-step="${i}" aria-pressed="${doneStep.has(i)}"><span class="num">${doneStep.has(i)?"✓":lab}</span><span class="s-txt">${st.p?'<span class="lbl">Voorbereiding</span>':""}${fill(st.s,c,n)}</span></button></li>`}).join("")}</ol>
      ${c.tip?`<p class="tip"><b>Tip · </b>${esc(c.tip)}</p>`:""}
      <p class="cheers ${total&&doneN===total?"on":""}">Proost!</p>
      <button class="reset" id="reset">Opnieuw beginnen</button>
      <p class="wl" id="wl" ${lock?"":"hidden"}>Je scherm blijft aan zolang dit recept open staat.</p>
    </section>
    </div>
  </div>`;
}

$("#sheet").addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t||!cur)return;
  if(t.id==="back"){close();return}
  if(t.id==="fav"){favs.has(cur.id)?favs.delete(cur.id):favs.add(cur.id);saveFavs()}
  else if(t.id==="t-need")tab="need";
  else if(t.id==="t-steps")tab="steps";
  else if(t.id==="minus")persons=Math.max(1,persons-1);
  else if(t.id==="plus")persons=Math.min(12,persons+1);
  else if(t.id==="reset")doneStep.clear();
  else if(t.dataset.ing){const i=+t.dataset.ing;doneIng.has(i)?doneIng.delete(i):doneIng.add(i)}
  else if(t.dataset.step){const i=+t.dataset.step;doneStep.has(i)?doneStep.delete(i):doneStep.add(i)}
  else return;
  const y=$("#sheet").scrollTop;renderDetail();$("#sheet").scrollTop=y;
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&cur)close()});

renderList();
route();
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
</html>
